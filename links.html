<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Link-uri utile</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <h1>Pagina cu link-uri</h1>

    <!-- Link text -->
    <p><a href="https://www.google.com" target="_blank">Vizitează Google</a></p>

    <!-- Link buton -->
    <p>
        <a href="https://www.wikipedia.org" target="_blank">
            <button>Deschide Wikipedia</button>
        </a>
    </p>

    <!-- Link pe imagine -->
    <p>
        <a href="https://openai.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/OpenAI_Logo.svg" 
                 alt="OpenAI" width="150">
        </a>
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Liste HTML</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <h1>Liste în HTML</h1>

    <h2>Listă neordonată (cu puncte):</h2>
    <ul>
        <li>Ciocolată</li>
        <li>Înghețată</li>
        <li>Pizza</li>
    </ul>

    <h2>Listă ordonată (cu numere):</h2>
    <ol>
        <li>Deschide browserul</li>
        <li>Intră pe GitHub</li>
        <li>Încarcă fișierul</li>
    </ol>
</body>
</html>
